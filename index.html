<body>
  <div class="demoarea">
    <div id="tiles" class="openseadragon"></div>
  </div>
  <script type="text/javascript">
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var params = new URLSearchParams(window.location.search);
    var dziUrl = params.get("dzi") || "https://static.brnrds.com/porto1892.dzi";
    var viewerOptions = {
      id: "tiles",
      prefixUrl: "openseadragon/images/",
      debugMode: false,
      immediateRender: false,
      loadDestinationTilesOnAnimation: false,
      tileSources: dziUrl
    };
    if (isIOS) {
      viewerOptions.imageLoaderLimit = 2;
      viewerOptions.maxTilesPerFrame = 1;
      viewerOptions.maxImageCacheCount = 120;
      viewerOptions.timeout = 60000;
      viewerOptions.animationTime = 0.5;
      viewerOptions.blendTime = 0;
    }
    OpenSeadragon(viewerOptions);
  </script>
